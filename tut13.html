    <title>CSS TUTORIALS And Media Queries</title>
    <!-- Internal CSS -->
    <style>
        h1{
            color: rgb(248, 59, 12);
            background-color: blue !important;
          } 
            /* padding; */
            /*
            box sizing is used to implement to stick to the width of the window
            for that you have to keep box sizing: border - box;
            Width contains margin and padding both altogether so by box sizeing we can change the property

             
             box-sizing: border-box;*/
             /* Universal selector */
             *{
                box-sizing: border-box;
                margin: 0px;
                padding: 0px;
             }

        
    </style>
</head>
