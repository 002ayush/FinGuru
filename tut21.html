    <title>Position in CSS and FlexBox</title>
    <style>
        /* Position in CSS 
        absolute - Move relative to its first parent 
        relative - Move relative to its normal positon
        fixed - Position relative to the browser window.
        sticky - Position relative to the browser window.
        z-index = is only when the position is given i.e absolute,relative ,fixed and sticky
        visibility mode is hidden will not display the element but reserve the space for  it and display will remove the space too.
        flex direction where we can implement the direction that is row reverse or column reverse.
        Althougth in flex flow we can write both the things the flex direction an flex wrap
        */
        .container
        {
            display: flex;
            
        }
    </style>
</head>
